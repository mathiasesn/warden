# release-plz needs no configuration here: changelog updates, git tags, GitHub
# releases, and publishing are all enabled by default, and this repo wants all
# four. Setting them explicitly would only restate the defaults.
#
# The file exists to record what is deliberately absent. There is no
# [[package]] version_group, because that only serves to keep several workspace
# crates on one version number, and warden is a single crate. If this repo ever
# becomes a workspace, every member must be listed here under a shared
# version_group or they will silently version independently.
[workspace]
